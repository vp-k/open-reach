# open-reach R1 출하 배터리 (Tier-1)
#
# 모든 항목은 R1 벤더 실측(후보 87건, `bench/evidence/vendor-probe*.json`)에서
# **감지기가 신뢰도 1.0 으로 벤더를 지목한** URL 이다. 추측으로 붙인 라벨은 없다.
#
# 범위를 3종이 아닌 4종으로 잡은 이유는 imperva 를 **음성 케이스로** 넣었기 때문이다.
# imperva 는 R1 HTTP 티어로 뚫리지 않는다 — 그 사실 자체를 고정해 둬야 나중에
# "뚫었다"는 판정이 진짜인지 알 수 있다. 실제로 실측 초안에서는 imperva 성공 2건이
# 잡혀 있었는데, 전부 Imperva 차단 페이지("Pardon Our Interruption", 200 + 700자)를
# 본문으로 오인한 것이었다. 이 배터리가 그 회귀를 다시 잡는다.
role: production
vendor_scope:
  - cloudflare
  - akamai
  - fastly
  - imperva
# SPEC 「Round 경계」가 WAF 감지기 9종 전체를 R2 로 두고, R2 계약을 R1 측정 결과로
# 확정한다고 규정한다. R1 실측에서 후보 87건 중 ≥2건을 확보한 벤더는 이 4종뿐이며
# (docs/r1-report.md §4), 남은 5종은 R2 에서 후보를 확보한 뒤 편입한다.
vendor_scope_reason: "R1 실측(후보 87건)에서 벤더별 ≥2건을 확보한 4종. 나머지 5종(datadome·perimeterx·aws_waf·kasada·f5)은 SPEC 「Round 경계」에 따라 R2. 벤더별 ≥2건 기준(G-1)은 낮추지 않았다."

entries:

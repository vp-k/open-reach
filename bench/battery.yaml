# open-reach R1 출하 배터리 (Tier-1)
#
# 모든 항목은 벤더 실측(`bench/evidence/vendor-probe*.json` 후보 87건 ·
# `r2-vendor-probe.json` 재실측 77건)에서 **감지기가 신뢰도 1.0 으로 벤더를 지목한**
# URL 이다. 추측으로 붙인 라벨은 없다.
#
# 범위에 imperva 가 있는 이유는 **음성 케이스로** 넣었기 때문이다.
# imperva 는 R1 HTTP 티어로 뚫리지 않는다 — 그 사실 자체를 고정해 둬야 나중에
# "뚫었다"는 판정이 진짜인지 알 수 있다. 실제로 실측 초안에서는 imperva 성공 2건이
# 잡혀 있었는데, 전부 Imperva 차단 페이지("Pardon Our Interruption", 200 + 700자)를
# 본문으로 오인한 것이었다. 이 배터리가 그 회귀를 다시 잡는다.
role: production
vendor_scope:
  - cloudflare
  - akamai
  - fastly
  - imperva
  - datadome
# SPEC 「Round 경계」가 WAF 감지기 9종 전체를 R2 로 두고, R2 계약을 R1 측정 결과로
# 확정한다고 규정한다. 편입 기준은 AC-B-009-1 의 문자 그대로 — **감지기가 신뢰도
# 1.0 으로 지목한 URL 이 2건 이상**이다.
#
# R1 보고서(docs/r1-report.md §4)는 datadome 을 "미달"로 적었으나, 그때 쓴 잣대는
# 기준에 없는 **본문 취득 성공 건수**(datadome 1건)였다. 같은 표에서 imperva 는
# 본문 성공 0건인데도 음성 케이스로 편입돼 있어 잣대가 항목마다 달랐다. R2 재실측
# (bench/evidence/r2-vendor-probe.json, 77 URL)에서 신뢰도 1.0 datadome 은 5건이고
# 그중 2건은 본문까지 취득된다. 기준을 낮춘 것이 아니라 **원래 기준으로 다시 잰**
# 결과이므로 datadome 을 편입한다 (G-8).
vendor_scope_reason: "AC-B-009-1 기준(신뢰도 1.0 지목 ≥2건)을 R2 재실측으로 다시 적용한 5종. 신뢰도 1.0 건수: cloudflare 18 · akamai 17 · datadome 5 · imperva 4 · fastly 4. 미달로 남은 4종은 aws_waf 1 · perimeterx 0 · kasada 0 · f5 0 이며, 기준(G-1)은 낮추지 않았다."


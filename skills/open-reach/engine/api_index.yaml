# open-reach Phase 0 — 공개 API 인덱스 (US-B-010)
#
# 여기 있는 항목은 전부 **실측된 것**이다. "그 사이트에 API 가 있을 것 같다"는
# 추측은 항목이 되지 않는다 (NG-10). 각 항목의 `source` 는 그 API 를 공개로
# 문서화한 페이지이고, `verified_at` 은 우리가 직접 요청해 200 과 본문을 확인한
# 날짜다. 증적은 bench/evidence/r2-payload-probe.json · r2-rescue-probe.json.
#
# 상한은 entries·search 합산 20 항목이다 (AC-B-010-15, R5 개정). 이 파일은 NG-9(지문표에 호스트 리터럴 금지)의
# 예외다 — 호스트를 적는 것이 존재 이유이기 때문이다. 대신 상한과 출처 의무가
# 그 자리를 대신한다.
#
# ── 여기에 없는 것과 그 이유 ────────────────────────────────────────────
# crates.io 2-hop (`/api/v1/crates/{name}` → `max_stable_version` →
#   `/api/v1/crates/{name}/{version}/readme`) 은 실측으로 확인됐다
#   (200 / text/html / 3511B, r2-payload-probe.json "crates.io/readme").
#   막던 것은 두 가지였고, 하나만 풀렸다.
#   ① 개정 전 AC-B-010-11 이 점을 세그먼트 이탈 **문자**로 못박아 `1.0.229` 같은
#      정상 버전 값이 정의상 불가능했다 → 사용자 승인으로 개정(점은 문자로 허용,
#      `.`·`..` **세그먼트**만 거부). 이 벽은 없어졌다.
#   ② 그러나 2-hop 의 목적지가 **다른 오리진으로 리디렉트한다.** 2026-09-01 실측:
#        /api/v1/crates/serde        -> 200, max_stable_version="1.0.229"  (1단 성공)
#        /api/v1/crates/serde/1.0.229/readme
#          -> https://static.crates.io/readmes/serde/serde-1.0.229.html   (오리진 이탈)
#      증거: bench/evidence/r2-crates-2hop-live-2026-09-01.json
#
#   ── 정정(R3): 이 항목이 여기에 없는 진짜 이유 ──
#   /api/v1/crates/{name}/{version}/readme 자체는 crates.io 와 **동일 오리진**의
#   문서화된 엔드포인트다. 도달 불가라서 빠진 게 아니다 — 일반 HTTP 티어는 이 302 를
#   홉별 SSRF·robots 재검사와 함께 따라가 readme 본문을 실제로 받아 온다(2026-09-01
#   실측: ok, final_route=http, static.crates.io 본문). AC-B-010-12(다른 호스트로
#   보낼 수 없다)는 **Phase 0 인덱스 조립 체인에만** 걸리는 규칙이고, 일반 fetch 의
#   리디렉션 추종에는 걸리지 않는다.
#   따라서 Phase 0 인덱스에서 크레이트 readme 를 라우팅하려면 리터럴을 조립해야 하는데,
#   ㉠ readme API 를 그대로 넣으면 인덱스 체인이 오리진을 이탈(AC-B-010-12 위반),
#   ㉡ static.crates.io URL 형식을 직접 조립하면 공식 문서에 그 형식이 없어
#      AC-B-010-15 의 `source` 의무를 못 채운다.
#   Phase 0 체인은 동일 오리진 유지가 설계 결정이므로(Q1: 현행 유지) 이 항목은 인덱스에
#   넣지 않는다 — 그러나 이는 '도달 불가'가 아니라 '일반 티어의 몫'이라는 뜻이다 (NG-10).

entries:
  # 실측: 원문 HTML 은 403 (r2-rescue-probe.json), 공개 API 는 200 에
  # `.items[0].body` 1340자. 즉 이 항목은 "구제"가 실제로 성립하는 유일한 실측 사례다.
  - host: stackoverflow.com
    url_pattern: "^/questions/(?P<id>[0-9]+)"
    source: "https://api.stackexchange.com/docs/questions-by-ids"
    verified_at: "2026-08-30"
    response_kind: json
    content_pointer: "items.0.body"
    endpoints:
      - "https://api.stackexchange.com/2.3/questions/{id}?site=stackoverflow&filter=withbody"

  # 실측(2026-09-02, R5 §9): news.ycombinator.com robots 는 /item 허용, HN Algolia
  # items API 는 200 JSON. 식별자가 쿼리에 있는 표현형이라 url_pattern 은
  # `경로?쿼리` 를 매치한다 (R5 개정). content_pointer `text` 는 코멘트·Ask HN 류의
  # 본문이다 — 링크 스토리는 text 가 null 이라 구제되지 않으며, 그것이 맞다
  # (그 본문은 외부 링크에 있고, 없는 본문을 지어내지 않는다 — NG-10).
  - host: news.ycombinator.com
    url_pattern: '^/item\?id=(?P<id>[0-9]+)$'
    source: "https://hn.algolia.com/api"
    verified_at: "2026-09-02"
    response_kind: json
    content_pointer: "text"
    endpoints:
      - "https://hn.algolia.com/api/v1/items/{id}"

  # 실측(2026-09-02, R5 §9): bsky.app robots 는 Allow: / 명시(Disallow 는
  # /intent/compose 뿐), public.api.bsky.app robots 도 Allow: / 명시.
  # getPostThread 는 핸들 그대로 1-hop 200 (응답이 DID 로 정규화 — 2-hop 불요).
  # XRPC 는 쿼리 파라미터 전용이라 이 항목이 "chain 없는 endpoints 한정 쿼리
  # 치환자" (AC-B-010-11 R5 개정) 의 실측 근거다. did:plc:… 핸들은 값의 `:` 가
  # 금지 문자라 구제되지 않는다 — 좁게 열고 fail-closed 로 남긴다.
  - host: bsky.app
    url_pattern: '^/profile/(?P<handle>[A-Za-z0-9.-]+)/post/(?P<rkey>[a-z0-9]+)$'
    source: "https://docs.bsky.app/docs/api/app-bsky-feed-get-post-thread"
    verified_at: "2026-09-02"
    response_kind: json
    content_pointer: "thread.post.record.text"
    endpoints:
      - "https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?uri=at://{handle}/app.bsky.feed.post/{rkey}"

# 검색 선언 (AC-B-014, R5) — 요청을 만들지 않는 판정 전용. 여기 적힌 URL 을
# 사용자가 직접 입력했을 때만 검색 결과 목록(짧은 블록의 나열)을 본문으로
# 인정한다(nav_shell 면제). 리디렉트로 도착한 경우는 해당 없다 (AC-B-014-2).
search:
  # 실측(2026-09-02, R5 §9): hn.algolia.com robots 404(부재=허용), search API 200 JSON.
  # 패턴은 실측된 두 검색 표현형을 다 담는다 — UI(`/?q=…`)와 API(`/api/v1/search?query=…`).
  # UI 는 JS SPA 라 T1 에서 길이 하한으로 실패할 수 있다 — 선언은 판정 전용이지
  # 성공 약속이 아니다(NG-10: 없는 돌파를 지어내지 않는다).
  - host: hn.algolia.com
    url_pattern: '^/(?:api/v1/search\?query=|\?q=).+'
    source: "https://hn.algolia.com/api"
    verified_at: "2026-09-02"

# ── 검색 소스 (R6/W5) ──────────────────────────────────────────────────────
# 위의 `search:` 와 다른 섹션이다. 그쪽은 **판정 전용**(요청 없음, AC-B-014-1)이고,
# 이쪽은 질의를 실제로 던져 URL 후보를 받아 온다.
#
# 등재 조건은 entries 와 같다 — `HONEST_UA` 로 직접 두드려 **200 과 실제 결과를
# 확인**한 것만 적는다 (AC-B-012-6 R6). 브라우저 UA 를 요구하는 SERP 는 등재하지
# 않는다: 등재해 놓고 런타임에만 다른 신원을 쓰면 실측이 거짓말이 된다 (NG-13).
#
# ── 여기에 없는 것과 그 이유 (2026-09-03 실측) ────────────────────────────
#   www.bing.com/search   200 이고 `b_algo` 10건이 실재하지만, 링크가
#                         `bing.com/ck/a?...&u=a1<base64url>` 로 감싸여 있어
#                         bing 전용 base64 디코더가 필요하다. ddg 로 같은 종류의
#                         결과(일반 웹 검색)를 이미 얻으므로 전용 변환을 추가하지
#                         않는다 — `link_transform` 은 percent 만 둔다.
#   export.arxiv.org      2026-09-03 실측 429. 200 을 못 봤으므로 등재하지 않는다.
#   search.naver.com      200 이지만 본문이 "검색 이용이 제한되었습니다" 안내
#                         328자다 (r6-contract §5). 결과가 없다.
search_sources:
  # 일반 웹 검색. 정직한 UA 로 200 + result-link 10건 (2026-09-03 실측).
  # 링크는 `//duckduckgo.com/l/?uddg=<퍼센트 인코딩된 실제 URL>` 로 감싸여 있어
  # `link_transform: percent` 로 푼다. 제목은 뽑지 않는다 — 링크와 제목을 각각
  # 별도 정규식으로 세어 위치로 짝지으면 개수가 어긋나는 순간 **틀린 제목**이
  # 붙는데, 그것은 없는 정보보다 나쁘다 (NG-10).
  - name: ddg
    host: lite.duckduckgo.com
    kind: html
    query_template: "https://lite.duckduckgo.com/lite/?q={query}"
    result_link_pattern: 'href="//duckduckgo\.com/l/\?uddg=([^"&]+)'
    link_transform: percent
    # 광고("Sponsored result")는 유기적 결과와 **같은** 래퍼·같은 class 로 나와
    # 정규식으로는 갈라낼 수 없다. 갈라지는 곳은 래핑을 푼 목적지다 —
    # 광고는 `duckduckgo.com/y.js?ad_domain=…` 로, 검색 엔진 자신을 가리킨다.
    # (2026-09-03 실측: 결과 11건 = 유기적 10 + 광고 1)
    exclude_hosts:
      - duckduckgo.com
    source: "https://duckduckgo.com/duckduckgo-help-pages/company/"
    verified_at: "2026-09-03"

  # 기술 토론. url 이 null 인 항목(Ask HN·자체 글)은 건너뛴다.
  - name: hn
    host: hn.algolia.com
    kind: json
    query_template: "https://hn.algolia.com/api/v1/search?query={query}"
    result_pointer: hits
    link_pointer: url
    title_pointer: title
    source: "https://hn.algolia.com/api"
    verified_at: "2026-09-03"

  # 프로그래밍 Q&A. 원문 HTML 은 403 인 경우가 있으나(entries 의 stackoverflow.com
  # 항목 참조) 검색 API 는 키 없이 200 이다.
  - name: stackexchange
    host: api.stackexchange.com
    kind: json
    query_template: "https://api.stackexchange.com/2.3/search/advanced?site=stackoverflow&pagesize=25&order=desc&sort=relevance&q={query}"
    result_pointer: items
    link_pointer: link
    title_pointer: title
    source: "https://api.stackexchange.com/docs/advanced-search"
    verified_at: "2026-09-03"

  # 공개 저장소. 미인증 검색은 분당 10회 제한이라 429 가 나오면 그대로 보고된다.
  - name: github
    host: api.github.com
    kind: json
    query_template: "https://api.github.com/search/repositories?per_page=25&q={query}"
    result_pointer: items
    link_pointer: html_url
    title_pointer: full_name
    source: "https://docs.github.com/en/rest/search/search"
    verified_at: "2026-09-03"

  # 백과. opensearch 는 [질의, [제목], [설명], [URL]] 의 **평행 배열**이라 항목당
  # 상대 포인터로 제목을 짝지을 수 없다 — URL 목록(`3`)만 쓰고 제목은 비운다.
  - name: wikipedia
    host: en.wikipedia.org
    kind: json
    query_template: "https://en.wikipedia.org/w/api.php?action=opensearch&format=json&limit=25&search={query}"
    result_pointer: "3"
    source: "https://www.mediawiki.org/wiki/API:Opensearch"
    verified_at: "2026-09-03"

  # 학술 메타데이터. DOI 해석 URL 을 그대로 준다.
  - name: crossref
    host: api.crossref.org
    kind: json
    query_template: "https://api.crossref.org/works?rows=25&query={query}"
    result_pointer: message.items
    link_pointer: URL
    title_pointer: title.0
    source: "https://api.crossref.org/swagger-ui/index.html"
    verified_at: "2026-09-03"

  # 학술 색인. `id` 는 openalex.org 랜딩 URL 이다 (doi 는 없는 항목이 있다).
  - name: openalex
    host: api.openalex.org
    kind: json
    query_template: "https://api.openalex.org/works?per-page=25&search={query}"
    result_pointer: results
    link_pointer: id
    title_pointer: title
    source: "https://docs.openalex.org/how-to-use-the-api/get-lists-of-entities/search-entities"
    verified_at: "2026-09-03"
